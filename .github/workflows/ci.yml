name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    container:
      image: ros:jazzy-ros-base

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            ros-jazzy-xacro \
            ros-jazzy-urdf \
            python3-colcon-common-extensions \
            python3-pytest

      - name: Build
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --cmake-args -DCMAKE_BUILD_TYPE=Release

      - name: Check the URDF
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          xacro urdf/my_agv.urdf.xacro > /tmp/my_agv.urdf
          check_urdf /tmp/my_agv.urdf

      - name: Run tests
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          python3 -m pytest tests -v

      - name: Check the launch files are valid python
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          python3 -m py_compile launch/*.py tools/*.py
